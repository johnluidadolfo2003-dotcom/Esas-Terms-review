services:
  - type: web
    name: esas-terms-reviewer
    runtime: node
    plan: free
    buildCommand: npm ci --legacy-peer-deps && npm run lint && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
